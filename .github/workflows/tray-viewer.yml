name: Publish the 3D tray viewer

on:
  push:
    branches: [main]
    paths:
      - notebooks/demo/tray-1.html
      - .github/workflows/tray-viewer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tray-viewer-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare the standalone viewer
        run: |
          mkdir _site
          cp notebooks/demo/tray-1.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
